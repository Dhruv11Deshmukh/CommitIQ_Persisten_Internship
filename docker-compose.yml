# Starts PostgreSQL 16 for CommitIQ.  Usage:  docker compose up -d
services:
  db:
    image: postgres:16
    container_name: commitments-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: commitments
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres   # must match DATABASE_URL in commitment-tracker/.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
